[package]
name = "evidenceloom-desktop"
version = "0.1.0-beta.10"
description = "Local-first multi-agent market research desktop application"
authors = ["Evidence Loom contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/simonguo/evidenceloom"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# Observation checks retain IEEE-754 behavior; numeric reviews read saved number lexemes verbatim.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
regex = "=1.13.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
aes-gcm = "0.10"
base64 = "0.22"
keyring = "4.1.5"
# Match Python/JS NFKC before reading the first authoritative saved rating.
unicode-normalization = "=0.1.25"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
