name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r commit; do
            if ! git show --no-patch --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "Missing Signed-off-by trailer: $commit" >&2
              failed=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.6.6
      - name: Install frozen dependencies
        run: uv sync --locked --group dev
      - name: Check lock and formatting
        run: |
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Verify generated notices
        if: matrix.python-version == '3.12'
        run: |
          uv run python scripts/generate_third_party_notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck, and test
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Audit dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check version synchronization
        run: python3 scripts/check_versions.py
      - name: Generate compile-time sidecar placeholder
        run: scripts/ensure_sidecar_placeholder.sh
      - name: Format, lint, and test
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Reject generated sidecars
        run: |
          if git ls-files 'src-tauri/binaries/evidenceloom-runner-*' | grep -q .; then
            echo "Generated sidecars must not be committed." >&2
            exit 1
          fi
