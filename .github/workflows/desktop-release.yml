name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    if: github.event_name == 'push'
    name: Prepare draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
            exit 0
          fi

          args=(
            --verify-tag
            --draft
            --generate-notes
            --title "Evidence Loom $GITHUB_REF_NAME"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  build-macos:
    if: github.event_name == 'push'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    environment: macos-signing
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and version
        shell: bash
        run: |
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$tag_commit" origin/main
          python scripts/check_versions.py --tag="$GITHUB_REF_NAME"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@11.6.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.6.6
          uv sync --locked --group dev
          npm --prefix frontend ci
      - name: Validate Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/evidenceloom-signing.p12"
          keychain_path="$RUNNER_TEMP/evidenceloom-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "\"$APPLE_SIGNING_IDENTITY\""
      - name: Build signed desktop application
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/build_desktop_sidecar.sh \
            --target "${{ matrix.target }}" \
            --mode sidecar
      - name: Verify macOS signature and notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$(find 'src-tauri/target/${{ matrix.target }}/release/bundle' -name '*.app' -print -quit)"
          dmg="$(find 'src-tauri/target/${{ matrix.target }}/release/bundle' -name '*.dmg' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

          sidecar="$app/Contents/MacOS/evidenceloom-runner"
          test -x "$sidecar"
          codesign --verify --strict --verbose=2 "$sidecar"
          sidecar_team_id="$(
            codesign --display --verbose=4 "$sidecar" 2>&1 |
              awk -F= '/^TeamIdentifier=/{print $2; exit}'
          )"
          test "$sidecar_team_id" = "$APPLE_TEAM_ID"

          set +e
          sidecar_output="$(printf '%s\n' '{"__command":"smoke_test"}' | "$sidecar" 2>&1)"
          sidecar_status=$?
          set -e
          printf '%s\n' "$sidecar_output"
          printf '%s\n' "$sidecar_output" | grep -q '"type": "ready"'
          if [[ "$sidecar_status" -ne 0 ]]; then
            echo "Bundled sidecar failed to start (exit $sidecar_status)." >&2
            exit 1
          fi

          notary_auth=(
            --apple-id "$APPLE_ID"
            --password "$APPLE_PASSWORD"
            --team-id "$APPLE_TEAM_ID"
          )

          submit_json=""
          for attempt in 1 2 3; do
            if submit_json="$(xcrun notarytool submit "$dmg" \
              "${notary_auth[@]}" \
              --output-format json \
              --no-progress)"; then
              break
            fi
            echo "Notary submission attempt $attempt failed; retrying." >&2
            sleep $((attempt * 10))
          done
          test -n "$submit_json"
          printf '%s\n' "$submit_json"

          submission_id="$(
            printf '%s' "$submit_json" |
              python -c 'import json, sys; print(json.load(sys.stdin)["id"])'
          )"
          test -n "$submission_id"

          accepted=false
          for attempt in $(seq 1 60); do
            if info_json="$(xcrun notarytool info "$submission_id" \
              "${notary_auth[@]}" \
              --output-format json \
              --no-progress 2>&1)"; then
              printf '%s\n' "$info_json"
              status="$(
                printf '%s' "$info_json" |
                  python -c 'import json, sys; print(json.load(sys.stdin)["status"])'
              )"
              case "$status" in
                Accepted)
                  accepted=true
                  break
                  ;;
                "In Progress")
                  ;;
                *)
                  echo "Apple notarization finished with status: $status" >&2
                  xcrun notarytool log "$submission_id" "${notary_auth[@]}" || true
                  exit 1
                  ;;
              esac
            else
              echo "Notary status attempt $attempt failed; retrying: $info_json" >&2
            fi
            sleep 20
          done
          test "$accepted" = true

          for attempt in 1 2 3; do
            if xcrun stapler staple "$dmg"; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 10))
          done
          xcrun stapler validate "$dmg"
      - name: Stage notarized DMG in draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(find 'src-tauri/target/${{ matrix.target }}/release/bundle' -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test -f "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber

  build-windows-test:
    if: github.event_name == 'workflow_dispatch'
    name: Build Windows-x86_64 (unsigned test)
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git fetch origin main
            tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
            git merge-base --is-ancestor "$tag_commit" origin/main
            python scripts/check_versions.py --tag="$GITHUB_REF_NAME"
          else
            python scripts/check_versions.py
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@11.6.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.6.6
          uv sync --locked --group dev
          npm --prefix frontend ci
      - name: Build unsigned Windows test application
        shell: bash
        run: |
          scripts/build_desktop_sidecar.sh \
            --target x86_64-pc-windows-msvc \
            --mode sidecar \
            --tauri-config '{"bundle":{"targets":["nsis"]}}'
      - name: Verify Windows test packages are unsigned
        shell: pwsh
        run: |
          $files = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Recurse -Include *.exe
          if (-not $files) { throw "No Windows installer packages were produced" }
          $files | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected unsigned test package at $($_.FullName), got signature status $($signature.Status)"
            }
          }
      - name: Publish Windows test installer to a draft release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Recurse -Include *.exe |
            Select-Object -First 1
          if (-not $installer) { throw "No Windows NSIS installer was produced" }

          $version = (Get-Content 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $testTag = "windows-test-v$version"
          $title = "Evidence Loom v$version unsigned Windows test"
          $notes = @"
          Unsigned Windows x64 test installer.

          This draft is for internal testing only. Windows SmartScreen may warn because the installer is not Authenticode-signed.
          Source commit: $env:GITHUB_SHA
          "@

          gh release view $testTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $testTag `
              --target $env:GITHUB_SHA `
              --draft `
              --prerelease `
              --title $title `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft test release" }
          }

          gh release upload $testTag $installer.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows test installer" }
  release:
    if: github.event_name == 'push'
    name: Attest and publish
    runs-on: ubuntu-24.04
    needs: [prepare-release, build-macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download staged macOS DMGs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifacts
          gh release download "$GITHUB_REF_NAME" \
            --dir release-artifacts \
            --pattern '*.dmg'
          count="$(find release-artifacts -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')"
          test "$count" -eq 2
      - name: Add legal files
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md release-artifacts/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/evidenceloom.spdx.json
          upload-artifact: false
      - name: Generate checksums
        working-directory: release-artifacts
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-artifacts/**
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=true
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
          fi
