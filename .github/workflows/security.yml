name: Security

on:
  pull_request:
    branches: [main, "quality/**"]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  frontend-dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.6.2
          npm ci
      - name: Audit the complete frontend dependency tree
        working-directory: frontend
        run: |
          audit_status=0
          npm audit --include=dev --include=optional --include=peer --json \
            > "$RUNNER_TEMP/evidenceloom-frontend-audit.json" || audit_status=$?
          if [[ "$audit_status" != 0 && "$audit_status" != 1 ]]; then
            exit "$audit_status"
          fi
          python3 ../scripts/check_frontend_audit.py \
            --report "$RUNNER_TEMP/evidenceloom-frontend-audit.json" \
            --lock package-lock.json
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

  python-dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the repository uv version
        run: python -m pip install --disable-pip-version-check uv==0.6.6
      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project --no-header
          --output-file "$RUNNER_TEMP/evidenceloom-runtime-requirements.txt"
      - name: Audit known Python runtime vulnerabilities
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --require-hashes --disable-pip --strict --progress-spinner off
          --requirement "$RUNNER_TEMP/evidenceloom-runtime-requirements.txt"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
