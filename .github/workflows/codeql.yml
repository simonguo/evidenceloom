name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  private-repository-availability:
    name: Private repository availability
    if: github.event.repository.private == true && vars.ENABLE_PRIVATE_CODEQL != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "CodeQL will run after publication or when ENABLE_PRIVATE_CODEQL=true with GitHub Advanced Security."

  analyze:
    if: github.event.repository.private == false || vars.ENABLE_PRIVATE_CODEQL == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
